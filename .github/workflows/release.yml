name: Release game
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
env:
  GAME_DIR: dist
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build game
        run: npm run build
      - name: Check release version and resolve artifact directory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const workspace = path.resolve(process.env.GITHUB_WORKSPACE);
          const root = path.resolve(workspace, process.env.GAME_DIR);
          if (!root.startsWith(workspace + path.sep)) throw Error('GAME_DIR must be a directory inside the game repository');
          const m = JSON.parse(fs.readFileSync(path.join(root, 'game.json'), 'utf8'));
          if ('v' + m.version !== process.env.RELEASE_TAG) throw Error('Tag and manifest version differ');
          if (/[\r\n]/.test(root)) throw Error('Invalid GAME_DIR');
          fs.appendFileSync(process.env.GITHUB_ENV, `GAME_PATH=${root}\n`);
          JS
      - name: Install latest Playroom validation tools
        env:
          PLATFORM_DIR: ${{ runner.temp }}/playroom-platform-tools
        run: |
          git clone --depth 1 --branch main --single-branch https://github.com/TommyLamm/playroom-platform.git "$PLATFORM_DIR"
          (cd "$PLATFORM_DIR" && npm ci)
      - name: Pack and fully validate release ZIP
        working-directory: ${{ runner.temp }}/playroom-platform-tools
        env:
          GAME_ZIP: ${{ runner.temp }}/playroom-release/game.zip
        run: |
          npm run game:pack -- "$GAME_PATH" "$GAME_ZIP"
          npm run game:validate -- "$GAME_ZIP"
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          GAME_ZIP: ${{ runner.temp }}/playroom-release/game.zip
        run: gh release create "$RELEASE_TAG" "$GAME_ZIP" --repo "$RELEASE_REPO" --verify-tag --generate-notes
